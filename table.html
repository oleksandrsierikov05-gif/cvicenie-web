<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table - Approved Students</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="formular_zadanie.css">
    <link rel="icon" type="image/png" href="IMG/icon.png">
</head>
<body>
    <div id="topbar-container"></div>

    <div class="content-wrapper" style="justify-content: center; align-items: center; min-height: 80vh;">
        <div class="form-container home-card" style="max-width: 900px; width: 100%;">
            <h1 style="color: #2c3e50; margin-top: 0; text-align: center;">Approved Students Schedule</h1>
            
            
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Course</th>
                        <th>Difficulty Level</th>
                        <th>Duration</th>
                        
                        <th style="width: 100px; text-align: center;">Action</th> 
                    </tr>
                </thead>
                <tbody id="table-body">
                    
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        
        function calculateDuration(level) {
            if (level === 'Beginner') return '8 Weeks';
            if (level === 'Intermediate') return '6 Weeks';
            if (level === 'Advanced') return '4 Weeks';
            return 'Unknown';
        }

        
        function loadTable() {
            const tbody = document.getElementById('table-body');
            const approvedList = JSON.parse(localStorage.getItem('approvedSubmissions')) || [];

            
            tbody.innerHTML = ''; 

            if (approvedList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">No approved students yet.</td></tr>';
                return;
            }

            
            approvedList.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${student.name || 'No Name'}</strong></td>
                    <td>${student.course || '-'}</td>
                    <td>${student.level || '-'}</td>
                    <td style="color: #3b82f6; font-weight: bold;">${calculateDuration(student.level)}</td>
                    <td style="text-align: center;">
                        <button onclick="deleteApproved(${index})" style="background-color: #ef4444; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.3s;">
                            Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        
        window.deleteApproved = function(index) {
            let approvedList = JSON.parse(localStorage.getItem('approvedSubmissions')) || [];
            
           
            approvedList.splice(index, 1);
            

            localStorage.setItem('approvedSubmissions', JSON.stringify(approvedList));
            
            
            loadTable();
        }

        document.addEventListener('DOMContentLoaded', loadTable);
    </script>
</body>
</html>
