<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prihlásenie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="formular_zadanie.css">
    <link rel="icon" type="image/png" href="IMG/icon.png">
    <script src="app.js" defer></script>
    <script src="prihlasenie.js" defer></script>
</head>
<body>
    <div id="topbar-container"></div>
    <main class="content-wrapper">
        <section class="form-container">
            <h1>Prihlásenie používateľa</h1>
            <form id="prihlasenieForm">
                <input id="email" type="email" placeholder="E-mail" required>
                <input id="heslo" type="password" placeholder="Heslo" required>
                <button class="submit-btn" type="submit">Prihlásiť sa</button>
            </form>
            <div id="vysledok" role="status" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
