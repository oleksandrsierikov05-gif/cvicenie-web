<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulár</title>
    <link rel="icon" type="image/png" href="IMG/icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="formular_zadanie.css">
</head>
<body>
    <div id="topbar-container"></div>

    <div class="content-wrapper">
        <div class="form-container" id="form-wrapper">
            <form id="task-form">
                
                <div class="form-group">
                    <label class="main-label">Meno a priezvisko</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label class="main-label">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="napr: meno@domena.sk">
                    </div>
                    <div class="form-group half">
                        <label class="main-label">Telefónne číslo</label>
                        <input type="tel" id="phone" name="phone" placeholder="+421 900 000 000">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label class="main-label">Dátum narodenia</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                    <div class="form-group half">
                        <label class="main-label">Kurz</label>
                        <select id="course" name="course">
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JavaScript">JavaScript</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label">Úroveň</label>
                    <div class="radio-group">
                        <label><input type="radio" name="level" value="Beginner" checked> Beginner</label>
                        <label><input type="radio" name="level" value="Intermediate"> Intermediate</label>
                        <label><input type="radio" name="level" value="Advanced"> Advanced</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label">Poznámka</label>
                    <textarea id="note" name="note" rows="3"></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label><input type="checkbox" id="terms" name="terms" required> Súhlasím s podmienkami</label>
                </div>

                <button type="submit" class="submit-btn">Odoslať formulár</button>
            </form>
        </div>

        <div class="preview-container">
            <h2 class="main-label" style="font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Živý náhľad</h2>
            <p><strong>Meno a priezvisko:</strong> <span id="preview-name"></span></p>
            <p><strong>E-mail:</strong> <span id="preview-email"></span></p>
            <p><strong>Kurz:</strong> <span id="preview-course">HTML</span></p>
            <p><strong>Úroveň:</strong> <span id="preview-level">Beginner</span></p>
            <p><strong>Poznámka:</strong> <span id="preview-note"></span></p>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="formular_zadanie.js"></script>
</body>
</html>
